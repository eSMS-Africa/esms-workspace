<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://auth.esmsafrica.io data:;" />
  <title>eSMS Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <div class="splash-inner">
      <img class="splash-logo" src="https://auth.esmsafrica.io/logo.png" alt="eSMS" />
      <div class="splash-name">eSMS <span>Workspace</span></div>
      <div class="splash-spin"><span></span></div>
      <div class="splash-tag">Loading your workspace…</div>
    </div>
    <div class="splash-foot">Email · SMS · SMPP · Links · Support · Admin</div>
  </div>

  <!-- Shell -->
  <div id="shell">
    <aside id="rail">
      <img id="logo" src="https://auth.esmsafrica.io/logo.png" alt="eSMS" />
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <button id="railUpdate" class="rail-update" title="Update ready - restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button id="railSettings" class="rail-settings" title="Settings" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </aside>
    <main id="stage"></main>
  </div>

  <!-- Settings / account menu -->
  <div id="settingsMenu" class="hidden" role="menu">
    <button id="miReloadAll" role="menuitem"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>Reload all services</button>
    <button id="miUpdates" role="menuitem"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span>Check for updates</button>
    <div class="mi-sep"></div>
    <button id="miClearLogins" role="menuitem"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>Clear saved logins<span id="savedCount" class="mi-hint"></span></button>
    <button id="miSignOut" role="menuitem" class="danger"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>Sign out everywhere</button>
  </div>

  <!-- Update toast -->
  <div id="updatebar" class="hidden">
    <div class="ub-dot"></div>
    <div class="ub-text"><strong id="ub-title">Update available</strong><span id="ub-sub"></span></div>
    <button id="ub-action" class="hidden">Restart</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
