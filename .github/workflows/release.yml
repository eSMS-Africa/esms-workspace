name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the jobs that publish to Releases get write.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        # Exact versions from package-lock.json.
        run: npm ci

      - name: Build & publish installers
        # electron-builder publishes to this repo's GitHub Releases when it sees a
        # tag build + GH_TOKEN. macOS -> universal .dmg, Windows -> .exe, Linux -> AppImage + .deb.
        # Unsigned builds (no signing secrets set): the download page + install.sh handle
        # macOS de-quarantine. To SIGN later, add CSC_LINK / CSC_KEY_PASSWORD (mac+win) and
        # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization), then drop the
        # CSC_IDENTITY_AUTO_DISCOVERY line below.
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Publish SHA256SUMS.txt so users (esp. on Windows, where the unsigned .exe
  # triggers SmartScreen) can verify the installer they downloaded is genuine.
  checksums:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checksum the published installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'eSMS-Workspace-*' || true
          if ls eSMS-Workspace-* >/dev/null 2>&1; then
            sha256sum eSMS-Workspace-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
            gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No installer assets found to checksum"
          fi
