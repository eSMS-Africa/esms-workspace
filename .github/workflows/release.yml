name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build & publish installers
        # electron-builder publishes to this repo's GitHub Releases when it sees a
        # tag build + GH_TOKEN. macOS -> universal .dmg, Windows -> .exe, Linux -> AppImage + .deb.
        # Unsigned builds (no signing secrets set): the download page + install.sh handle
        # macOS de-quarantine. To SIGN later, add CSC_LINK / CSC_KEY_PASSWORD (mac+win) and
        # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization), then drop the
        # CSC_IDENTITY_AUTO_DISCOVERY line below.
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
